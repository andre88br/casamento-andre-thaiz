<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Planejamento · André & Thaiz</title>
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <!-- LOGIN / PRIMEIRO ACESSO -->
  <main class="auth" id="auth" hidden>
    <form class="card" id="auth-form" autocomplete="on">
      <h1>A<span>✈</span>T</h1>
      <h2 id="auth-titulo">Entrar</h2>
      <p class="hint" id="auth-hint"></p>
      <label>Usuário <input id="a-user" autocomplete="username" required /></label>
      <label>Senha <input id="a-pass" type="password" autocomplete="current-password" required /></label>
      <label id="a-pass2-wrap" hidden>Repetir senha <input id="a-pass2" type="password" autocomplete="new-password" /></label>
      <p class="erro" id="auth-erro" role="alert"></p>
      <button class="btn" id="auth-btn">Entrar</button>
    </form>
  </main>

  <!-- APP -->
  <div id="app" hidden>
    <header class="top">
      <strong>A✈T · Planejamento</strong>
      <nav>
        <button class="tab on" data-tab="lista">Planilha</button>
        <button class="tab" data-tab="usuarios">Usuários</button>
        <button class="btn btn--ghost" id="logout">Sair (<span id="eu"></span>)</button>
      </nav>
    </header>

    <section id="tab-lista" class="wrap">
      <div class="abas" id="abas"></div>
      <div class="stats" id="stats"></div>
      <div class="acoes">
        <input id="f-busca" type="search" placeholder="Buscar nesta aba…" />
        <button class="btn" id="add-linha">+ Linha</button>
        <button class="btn btn--ghost" id="add-col">+ Coluna</button>
        <button class="btn btn--ghost" id="ren-aba">Renomear aba</button>
        <button class="btn btn--ghost" id="del-aba">Excluir aba</button>
      </div>
      <div class="tabela"><table id="grade"></table></div>
      <div class="acoes">
        <button class="btn" id="salvar" disabled>Salvar alterações</button>
        <span class="hint" id="status"></span>
        <span class="espaco"></span>
        <label class="btn btn--ghost">Importar .xlsx<input type="file" id="imp" accept=".xlsx,.xls" hidden /></label>
        <button class="btn btn--ghost" id="exp">Exportar .xlsx</button>
      </div>
    </section>

    <section id="tab-usuarios" class="wrap" hidden>
      <h2>Usuários com acesso</h2>
      <ul class="users" id="users"></ul>
      <form class="card" id="user-form">
        <h3>Criar novo usuário</h3>
        <label>Usuário <input id="n-user" autocomplete="off" required /></label>
        <label>Senha <input id="n-pass" type="password" autocomplete="new-password" required minlength="6" /></label>
        <p class="erro" id="user-erro" role="alert"></p>
        <button class="btn">Criar usuário</button>
      </form>
    </section>
  </div>

  <script src="js/config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
