<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Planejamento · André & Thaiz</title>
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
  <!-- LOGIN / PRIMEIRO ACESSO -->
  <main class="auth" id="auth" hidden>
    <form class="card" id="auth-form" autocomplete="on">
      <h1>A<span>✈</span>T</h1>
      <h2 id="auth-titulo">Entrar</h2>
      <p class="hint" id="auth-hint"></p>
      <label>Usuário <input id="a-user" autocomplete="username" required /></label>
      <label>Senha <input id="a-pass" type="password" autocomplete="current-password" required /></label>
      <label id="a-pass2-wrap" hidden>Repetir senha <input id="a-pass2" type="password" autocomplete="new-password" /></label>
      <p class="erro" id="auth-erro" role="alert"></p>
      <button class="btn" id="auth-btn">Entrar</button>
    </form>
  </main>

  <!-- APP -->
  <div id="app" class="app" hidden>
    <aside class="side" id="side">
      <div class="brand"><div>A<span>✈</span>T <small>Planejamento</small></div><button class="recolher" id="recolher" title="Recolher menu" aria-label="Recolher menu">«</button></div>
      <nav id="menu"></nav>
      <div class="side__foot">
        <button class="item" id="m-respostas" title="Respostas do site"><i>📨</i><span>Respostas do site</span></button>
        <button class="item" id="m-usuarios" title="Usuários"><i>🔑</i><span>Usuários</span></button>
        <button class="item" id="exp" title="Exportar .xlsx"><i>⬇️</i><span>Exportar .xlsx</span></button>
        <button class="item" id="logout" title="Sair"><i>🚪</i><span>Sair (<span id="eu"></span>)</span></button>
      </div>
    </aside>
    <div class="main">
      <header class="bar">
        <button class="burger" id="burger" aria-label="Menu">☰</button>
        <h1 id="titulo"></h1>
        <span class="hint" id="status"></span>
        <button class="btn" id="salvar" disabled>Salvar</button>
      </header>
      <div class="content" id="content"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
