# Batida diária no banco (Supabase grátis pausa após 7 dias sem uso).
# Grava a data de hoje na tabela "ping". A chave usada é a pública do site.
name: Manter banco ativo
on:
  schedule:
    - cron: "17 11 * * *" # todo dia, 08:17 (Brasília)
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping no Supabase
        run: |
          curl -fsS -X POST "https://klnmsandpgpnjibdqpry.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_h9GQUTqockn1K2JBP2SOwA_n2sIaloD" \
            -H "Content-Type: application/json" -d '{}'
